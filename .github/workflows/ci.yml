name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 编译 + 单元测试
        run: npm test

      - name: 打包 VSIX（验证 packaging 配置）
        # 注意：vsce 的 --out 是**文件**路径而不是目录，写 `--out dist/` 会报
        # ENOTDIR: not a directory, stat 'dist/'。这里用默认输出名
        # grub-theme-autocomplete-<版本>.vsix（生成在仓库根目录），与 README 一致。
        run: npx --yes @vscode/vsce package

      - uses: actions/upload-artifact@v7
        with:
          # archive: false → 产物不再套一层 zip，Run 页面里直接就是一个可安装的 .vsix 文件
          #（v7 起支持；此时只允许上传单个文件，artifact 名取自文件名，name 参数会被忽略）
          archive: false
          path: grub-theme-autocomplete-*.vsix
          if-no-files-found: error

  # 打 v* tag 时把构建好的 VSIX 发成 Release：
  # Release 附件是原样提供的长期下载地址，不像 artifact 那样 90 天后过期。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 里的版本 ${version} 不一致"
            exit 1
          fi
          echo "vsix=grub-theme-autocomplete-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: 取回 build 产物
        # 产物是 archive: false 上传的单文件，需要 v8 才能原样下载（不会解压）
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: dist

      - name: 创建 Release 并附加 VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.vsix --clobber
          else
            gh release create "$tag" dist/*.vsix --title "$tag" --generate-notes
          fi
          gh release view "$tag" --json tagName,url,assets
